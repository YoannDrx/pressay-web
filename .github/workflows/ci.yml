name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Lint, types, unit tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:unit
      - run: pnpm audit --prod --audit-level high
      # The build needs no secret: identity and billing stay disabled (fail
      # closed) when their variables are absent.
      - run: pnpm build
        env:
          NEXT_TELEMETRY_DISABLED: "1"

  public-e2e:
    name: Public site (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
        env:
          NEXT_TELEMETRY_DISABLED: "1"
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: public-e2e-results
          path: test-results
          retention-days: 7

  account-e2e:
    name: Account and identity (Playwright, local PostgreSQL)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_HOST_AUTH_METHOD: trust
          POSTGRES_DB: pressay_web_e2e
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Throwaway CI database; the account config refuses any non-local URL.
      WEB_TEST_DATABASE_URL: postgresql://postgres@127.0.0.1:5432/pressay_web_e2e
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: oven-sh/setup-bun@v2
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm exec playwright test -c playwright.account.config.ts
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: account-e2e-results
          path: test-results
          retention-days: 7
